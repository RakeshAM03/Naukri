########################################################
# Environment / Runtime configuration
########################################################

# Application under test
url=https://www.naukri.com

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true for CI / scheduled task execution, false for local debugging)
headless=false

# Implicit / explicit wait timeouts (seconds)
implicitWait=10
explicitWait=20
pageLoadTimeout=60

# ---------------------------------------------------------------
# IMPORTANT: Do NOT commit real credentials to source control.
# Populate testdata/testdata.xlsx (sheet "login") with the actual
# email/password for the account, OR override at runtime via
# environment variables / -D system properties, e.g.:
#   mvn test -Dnaukri.email=you@example.com -Dnaukri.password=yourPassword
# ExcelReader / ConfigReader fall back to these system properties
# when present, so credentials never need to live in this file.
# ---------------------------------------------------------------

# Resume file to upload during the profile update step.
# Kept local and ignored by Git; replace this file when the resume changes.
resumeFilePath=/Users/rakesham/Downloads/Naukri/testdata/resume.pdf

# Screenshot directory
screenshotPath=screenshots/

# Excel test data file
excelFilePath=testdata/testdata.xlsx
excelSheetName=login

# ChainTest report output directory
reportPath=reports/chaintest/
